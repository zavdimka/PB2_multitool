MACHINE = "pocketbeagle2"
DISTRO = "pb2-fast"

DL_DIR = "${TOPDIR}/../downloads"
SSTATE_DIR = "${TOPDIR}/../sstate-cache"
BB_NUMBER_THREADS = "12"
PARALLEL_MAKE = "-j 12"

IMAGE_LINK_NAME = "${IMAGE_BASENAME}-${MACHINE}"
INHERIT:remove = "testimage"

PREFERRED_VERSION_slint-cpp = "1.18.1"
PREFERRED_VERSION_slint-cpp-native = "1.18.1"

PACKAGECONFIG:append:pn-slint-cpp = " backend-linuxkms "
PACKAGECONFIG:remove:pn-slint-cpp = " renderer-femtovg interpreter "
EXTRA_OECMAKE:append:pn-slint-cpp = " -DSLINT_FEATURE_BACKEND_LINUXKMS_LIBSEAT=ON -DSLINT_FEATURE_BACKEND_LINUXKMS_LIBINPUT=ON "

# The current meta-slint also supports Arago; this image deliberately uses Poky.
BBMASK += "meta-slint/dynamic-layers/meta-ti/recipes-tisdk/tisdk-uenv/"