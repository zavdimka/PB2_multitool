BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "pb2"
BBFILE_PATTERN_pb2 = "^${LAYERDIR}/"
BBFILE_PRIORITY_pb2 = "8"

LAYERDEPENDS_pb2 = "core meta-ti-bsp meta-beagle"
LAYERSERIES_COMPAT_pb2 = "scarthgap"

WKS_FILE_PATH:append = ":${LAYERDIR}/wic"
