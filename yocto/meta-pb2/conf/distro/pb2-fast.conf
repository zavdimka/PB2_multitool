# INIT_MANAGER must be selected before poky.conf pulls in defaultsetup.conf.
INIT_MANAGER = "mdev-busybox"
VIRTUAL-RUNTIME_dev_manager = "busybox-mdev"

require conf/distro/poky.conf

DISTRO = "pb2-fast"
DISTRO_NAME = "PocketBeagle 2 Fast Boot"
DISTRO_VERSION = "1.0"

# Keep only features needed by the embedded system and direct DRM/KMS UI.
DISTRO_FEATURES:remove = "acl alsa argp bluetooth debuginfod ext2 ipv6 irda nfc nfs ptest pulseaudio seccomp usbgadget wayland wifi x11 zeroconf"
DISTRO_FEATURES:append = " ipv4 largefile opengl"

FULL_OPTIMIZATION = "-Os -pipe ${DEBUG_FLAGS}"

EXTRA_IMAGE_FEATURES = ""
PACKAGE_CLASSES = "package_ipk"

# Avoid generating large SPDX archives during this development build.
INHERIT:remove = "create-spdx"