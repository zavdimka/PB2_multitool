# Keep the PRU and ADC paths built in: BusyBox/mdev does not need to load
# modules during boot and the hardware is immediately available.
CONFIG_TI_PRUSS=y
CONFIG_TI_PRUSS_INTC=y
CONFIG_PRU_REMOTEPROC=y
CONFIG_RPMSG_CHAR=y
CONFIG_RPMSG_CTRL=y
CONFIG_IIO=y
CONFIG_IIO_TRIGGERED_BUFFER=y
CONFIG_IIO_KFIFO_BUF=y
CONFIG_IIO_HRTIMER_TRIGGER=y
CONFIG_IIO_CONFIGFS=y
CONFIG_CONFIGFS_FS=y
CONFIG_TI_ADS8688=y

# USB-C device port: RNDIS Ethernet gadget for the OpenOCD GDB endpoint.
CONFIG_USB_GADGET=y
CONFIG_USB_LIBCOMPOSITE=y
CONFIG_USB_CONFIGFS=y
CONFIG_USB_F_RNDIS=y
CONFIG_USB_CONFIGFS_RNDIS=y

CONFIG_HWMON=y
CONFIG_SENSORS_INA238=y
CONFIG_REGULATOR=y
CONFIG_REGULATOR_TPS55289=y

# LCDWiki MSP4031: ST7796S display, GPIO backlight and FT6336U touch.
CONFIG_DRM=y
CONFIG_DRM_PANEL_MIPI_DBI=y
CONFIG_DRM_FBDEV_EMULATION=y
CONFIG_BACKLIGHT_GPIO=y
CONFIG_INPUT_TOUCHSCREEN=y
CONFIG_TOUCHSCREEN_EDT_FT5X06=y
CONFIG_EXTRA_FIRMWARE="lcdwiki,msp4031.bin"
CONFIG_EXTRA_FIRMWARE_DIR="firmware"
