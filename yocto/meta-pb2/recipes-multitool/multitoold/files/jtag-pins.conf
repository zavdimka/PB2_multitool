# PB2 multitool default JTAG/SWD profile.
# Values are PRU1 R30/R31 bit numbers, not Linux GPIO numbers.
#
# Signal       External pin   Data bit       74LVC1T45 DIR bit
# TCK/SWCLK    IO0 / P2.08    PRU1 R30.3     P2.06 / R30.2
# TMS/SWDIO    IO1 / P2.24    PRU1 R30/31.6  P2.10 / R30.4
# TDI          IO2 / P2.30    PRU1 R30.12    P2.28 / R30.15
# TDO          IO3 / P2.34    PRU1 R31.14    P2.32 / R30.11
# nSRST        IO4 / P2.19    PRU1 R30.16    P2.17 / R30.19
# nTRST        IO5 / P2.35    PRU1 R30.8     P2.33 / R30.7

tck = 3
tms = 6
tdi = 12
tdo = 14
srst = 16
trst = 8

tck_dir = 2
tms_dir = 4
tdi_dir = 15
tdo_dir = 11
srst_dir = 19
trst_dir = 7

# MAIN_PADCONFIG0 address and complete AM62 pad values for P2.24.
# SWD turnaround switches between PRU1 GPO6 (mode 2) and GPI6 (mode 3).
# Change these three values together when moving SWDIO to another pin.
swdio_pad_address = 0x000f40d0
swdio_pad_output = 0x00010002
swdio_pad_input = 0x00054003

# Delay after each level change; PRU1 runs at 200 MHz.
delay_cycles = 16

# OpenOCD reset arguments are logical assertions; board signals are nRESET.
reset_active_low = 1